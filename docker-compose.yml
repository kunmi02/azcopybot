services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-copybot}
      POSTGRES_USER: ${POSTGRES_USER:-copybot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    volumes:
      - copybot_pg:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-copybot} -d ${POSTGRES_DB:-copybot}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    networks:
      - copybot

    logging:
      options:
        max-size: "10m"
        max-file: "5"


  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      NODE_ENV: production
      API_PORT: 8080

      # Coolify will generate a public URL for the web service.
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-${SERVICE_URL_WEB_3000}}

      # Database is private inside the Compose network.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-copybot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-copybot}"

      # Telegram
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      ALLOWED_TELEGRAM_USER_IDS: ${ALLOWED_TELEGRAM_USER_IDS:?ALLOWED_TELEGRAM_USER_IDS is required}

      # FomoScan
      FOMOSCAN_API_KEY: ${FOMOSCAN_API_KEY:-}
      FOMOSCAN_API_BASE: ${FOMOSCAN_API_BASE:-https://api.fomoscan.sh}

      # Solana / Triton
      TRITON_GRPC_ENDPOINT: ${TRITON_GRPC_ENDPOINT:?TRITON_GRPC_ENDPOINT is required}
      TRITON_GRPC_XTOKEN: ${TRITON_GRPC_XTOKEN:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:?SOLANA_RPC_URL is required}

      # Jupiter
      JUPITER_API_BASE: ${JUPITER_API_BASE:-https://api.jup.ag/swap/v1}
      JUPITER_API_KEY: ${JUPITER_API_KEY:-}

      # Optional OKX fallback
      OKX_API_KEY: ${OKX_API_KEY:-}
      OKX_API_SECRET: ${OKX_API_SECRET:-}
      OKX_API_PASSPHRASE: ${OKX_API_PASSPHRASE:-}
      OKX_PROJECT_ID: ${OKX_PROJECT_ID:-}

      # Users / copy wallets
      BOOTSTRAP_USERS_JSON: ${BOOTSTRAP_USERS_JSON:-[]}

      # Private signing keys.
      # Keep these only in Coolify environment variables.
      TRADING_WALLET_USER_A_SOL_PRIVATE_KEY: ${TRADING_WALLET_USER_A_SOL_PRIVATE_KEY:-}
      TRADING_WALLET_USER_B_SOL_PRIVATE_KEY: ${TRADING_WALLET_USER_B_SOL_PRIVATE_KEY:-}

      # Tells Coolify to create a domain routed to backend port 8080.
      SERVICE_URL_BACKEND_8080: /

    expose:
      - "8080"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - copybot

    logging:
      options:
        max-size: "10m"
        max-file: "5"


  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile

      args:
        # NEXT_PUBLIC_* is compiled into the browser bundle.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-${SERVICE_URL_BACKEND_8080}}

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    environment:
      NODE_ENV: production

      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-${SERVICE_URL_BACKEND_8080}}

      # Tells Coolify to generate a domain routed to port 3000.
      SERVICE_URL_WEB_3000: /

    expose:
      - "3000"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - copybot

    logging:
      options:
        max-size: "10m"
        max-file: "5"


volumes:
  copybot_pg:


networks:
  copybot:
    driver: bridge

